<!DOCTYPE html>
<html lang="pt-BR" class="min-h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz por Frames - Otaku Expert</title>
    <link rel="icon" type="image/jpeg" href="../img/banner.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950 via-slate-950 to-black">
    <header class="w-full flex flex-col gap-3 px-4 py-4 border-b border-indigo-900/50 bg-black/40 backdrop-blur-md sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <div>
            <p class="text-xs uppercase tracking-[0.3em] text-cyan-400 font-bold">Otaku Expert Unemployed</p>
            <h1 class="font-arcade text-lg font-black text-white sm:text-2xl">Adivinhe o anime pelo frame</h1>
        </div>
        <nav class="flex flex-wrap gap-2" aria-label="Outros modos de jogo">
            <a href="foto.html" class="rounded-xl border border-indigo-700/50 bg-indigo-950 px-4 py-2 text-sm text-indigo-100 transition hover:bg-indigo-900">
                <i class="fa-solid fa-eye mr-2"></i>Modo Imagem
            </a>
            <a href="voice.html" class="rounded-xl border border-indigo-700/50 bg-indigo-950 px-4 py-2 text-sm text-indigo-100 transition hover:bg-indigo-900">
                <i class="fa-solid fa-volume-high mr-2"></i>Modo Voz
            </a>
        </nav>
    </header>

    <main class="mx-auto flex w-full max-w-3xl flex-grow flex-col justify-center px-3 py-6 sm:px-4 sm:py-8">
        <section class="rounded-3xl border border-indigo-800/40 bg-slate-900/80 p-4 shadow-2xl sm:p-6 md:p-8">
            <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                <p class="text-sm text-indigo-200">Descubra de qual anime é a imagem. Cada erro revela um novo frame.</p>
                <div class="flex gap-2">
                    <div class="rounded-xl border border-indigo-800/50 bg-indigo-950/60 px-3 py-2 text-xs text-indigo-200">
                        Pontos: <span id="scoreValue" class="font-bold text-yellow-400">0</span>
                    </div>
                    <div class="rounded-xl border border-indigo-800/50 bg-indigo-950/60 px-3 py-2 text-xs text-indigo-200">
                        Sequência: <span id="streakValue" class="font-bold text-amber-400">0</span>
                    </div>
                </div>
            </div>

            <div class="relative mx-auto aspect-video w-full max-w-2xl overflow-hidden rounded-2xl border-2 border-indigo-700/60 bg-black">
                <img id="frameImage" src="" alt="Frame para descobrir o anime" class="h-full w-full object-contain">
                <span id="frameCount" class="absolute bottom-3 right-3 rounded-lg border border-indigo-700/50 bg-black/80 px-3 py-1 text-sm font-bold text-indigo-100">Frame 1 de 3</span>
            </div>

            <div class="mt-4 flex justify-center gap-2" aria-label="Tentativas">
                <span class="frame-dot h-2.5 w-10 rounded-full bg-cyan-400"></span>
                <span class="frame-dot h-2.5 w-10 rounded-full bg-indigo-900"></span>
                <span class="frame-dot h-2.5 w-10 rounded-full bg-indigo-900"></span>
            </div>

            <form id="guessForm" class="mt-6 flex flex-col gap-3 sm:flex-row">
                <label for="animeGuess" class="sr-only">Nome do anime</label>
                <input id="animeGuess" type="text" autocomplete="off" placeholder="Qual é o anime?" class="w-full min-w-0 flex-1 rounded-xl border-2 border-indigo-800/60 bg-slate-950/80 px-4 py-3 text-base text-white outline-none placeholder-indigo-400/50 focus:border-cyan-500">
                <button id="submitGuess" type="submit" class="rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 px-6 py-3 font-bold text-white transition hover:from-cyan-500 hover:to-blue-500">
                    Responder
                </button>
            </form>

            <p id="feedback" class="mt-4 min-h-6 text-center text-sm text-indigo-200" aria-live="polite">Carregando o jogo...</p>
            <button id="nextRound" type="button" class="hidden mt-4 w-full rounded-xl bg-gradient-to-r from-pink-600 to-purple-600 py-3 font-bold text-white transition hover:opacity-90">
                Próximo anime <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </section>
    </main>

    <script src="../script/frame-game.js" defer></script>
</body>
</html>
